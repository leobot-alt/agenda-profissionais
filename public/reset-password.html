<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redefinir senha | Painel RH</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#29234d;background:#f6f6ff}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#faf7ff,#eef8ff)}
    .card{width:min(100%,480px);background:#fff;border:1px solid #e8e5f3;border-radius:22px;padding:32px;box-shadow:0 18px 55px #3b28731c}
    .brand{display:inline-flex;padding:9px 17px;border-radius:14px;background:linear-gradient(110deg,#ad5ce8,#37a9df);color:#fff;font-weight:800;letter-spacing:.2px}
    h1{margin:22px 0 8px;font-size:27px;color:#43318d}p{color:#68647b;line-height:1.5}.field{margin-top:18px}label{display:block;margin-bottom:7px;font-weight:700;color:#514c67}input{width:100%;padding:13px 14px;border:1px solid #d9d6e8;border-radius:11px;font-size:16px;outline:none}input:focus{border-color:#8e64dd;box-shadow:0 0 0 3px #8e64dd22}.actions{display:flex;gap:10px;margin-top:22px}button{border:0;border-radius:11px;padding:13px 17px;font-weight:800;font-size:15px;cursor:pointer}.primary{flex:1;color:#fff;background:linear-gradient(110deg,#a65be4,#37a8df)}.secondary{background:#f1eff8;color:#514c67}.message{min-height:24px;margin-top:16px;font-weight:700}.error{color:#b84968}.success{color:#25805b}.muted{font-size:14px}.hidden{display:none}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">somente</div>
    <h1>Redefinir senha</h1>
    <p id="intro">Escolha uma nova senha para acessar o Painel RH.</p>
    <form id="form">
      <div class="field"><label for="password">Nova senha</label><input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="Mínimo de 8 caracteres" required></div>
      <div class="field"><label for="confirmation">Confirmar nova senha</label><input id="confirmation" type="password" minlength="8" autocomplete="new-password" placeholder="Repita a nova senha" required></div>
      <div id="message" class="message" role="status" aria-live="polite"></div>
      <div class="actions"><button class="primary" id="save" type="submit">Salvar nova senha</button><button class="secondary" type="button" onclick="location.href='./'">Voltar</button></div>
    </form>
  </main>
  <script>
    const SUPABASE_URL='https://qejlgslpxwogtfeycfoy.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY='sb_publishable_jHj7VVaaXDvJearqt0Ajag_nrKytmfu';
    const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
    const message=document.getElementById('message'), save=document.getElementById('save');
    function show(text,kind){message.textContent=text;message.className='message '+(kind||'');}
    let recoveryReady=false;
    client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY' || session){recoveryReady=true;}});
    client.auth.getSession().then(({data,error})=>{if(error || !data.session){show('Este link é inválido ou expirou. Solicite um novo link na tela de login.','error');save.disabled=true;}});
    document.getElementById('form').addEventListener('submit',async(event)=>{
      event.preventDefault(); show('');
      const password=document.getElementById('password').value, confirmation=document.getElementById('confirmation').value;
      if(password.length<8){show('A senha deve ter pelo menos 8 caracteres.','error');return;}
      if(password!==confirmation){show('As senhas não conferem.','error');return;}
      save.disabled=true; save.textContent='Salvando...';
      const {error}=await client.auth.updateUser({password});
      if(error){show('Não foi possível alterar a senha. O link pode ter expirado; solicite outro.','error');save.disabled=false;save.textContent='Salvar nova senha';return;}
      show('Senha alterada com sucesso. Redirecionando para o login...','success');
      await client.auth.signOut(); setTimeout(()=>location.href='./',1800);
    });
  </script>
</body>
</html>
